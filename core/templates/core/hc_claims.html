    // Create new claim
    function createNewClaim() {
        var date = $('#newClaimDate').val();
        if (!date) {
            alert('Please select a date for the claim.');
            return;
        }
        
        // Get selected bill PKs
        var billPks = [];
        $('.bill-checkbox:checked').each(function() {
            billPks.push(parseInt($(this).val()));
        });
        
        // Get selected snap PKs
        var snapPks = [];
        $('.snap-checkbox:checked').each(function() {
            snapPks.push(parseInt($(this).val()));
        });
        
        $.ajax({
            url: '/core/create_hc_claim/',
            type: 'POST',
            contentType: 'application/json',
            headers: { 'X-CSRFToken': Utils.getCSRFToken() },
            data: JSON.stringify({
                project_pk: projectPk,
                date: date,
                bill_pks: billPks,
                snap_pks: snapPks
            }),
            success: function(response) {
                if (response.status === 'success') {
                    $newClaimForm.removeClass('show');
                    $('#newClaimBtn').show();
                    
                    // Reload claims list and select new claim
                    loadClaimsList();
                    setTimeout(function() {
                        $claimSelector.val(response.hc_claim_pk);
                        loadClaimData(response.hc_claim_pk);
                    }, 500);
                    
                    // Reload available bills and snaps
                    loadAvailableBills();
                    loadAvailableSnaps();
                } else {
                    alert('Error: ' + (response.error || 'Failed to create claim'));
                }
            },
            error: function(xhr) {
                var error = xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error';
                alert('Error creating claim: ' + error);
            }
        });
    }
    
    // Load claim data
    function loadClaimData(claimPk) {
        currentClaimPk = claimPk;
        
        $tableBody.html('<tr><td colspan="' + getColCount() + '" class="text-center" style="padding: 20px;">Loading...</td></tr>');
        
        $.ajax({
            url: '/core/get_hc_claim_data/' + claimPk + '/?project_pk=' + projectPk,
            type: 'GET',
            success: function(response) {
                if (response.status === 'success') {
                    currentClaimData = response.claim;
                    budgetData = response.budget_data;
                    
                    // Check if claim is finalized (status != 0)
                    if (currentClaimData.status !== 0) {
                        renderFinalizedReport();
                    } else {
                        renderBudgetTable();
                    }
                    updateClaimStatus();
                    updateActionButtons();
                }
            },
            error: function(xhr, status, error) {
                console.error('Failed to load claim data:', error);
                $tableBody.html('<tr><td colspan="' + getColCount() + '" class="text-center text-danger" style="padding: 20px;">Error loading claim data</td></tr>');
            }
        });
    }
    
    // Render finalized claim report (PDF-friendly).
    //
    // Single table, multi-level header. Column groups, in order:
    //   - Category               (rowspan=2)
    //   - Contract Budget        (rowspan=2; base contract excluding variations)
    //   - This Claim             (colspan=3): HC Variation | HC Claim | QS Claim
    //   - Prev Claims            (colspan=3): HC Variation | HC Claim | QS Claim
    //   - Total Claimed          (colspan=2): HC | QS
    //   - Still to Claim         (colspan=2): HC | QS
    //
    // Notes on the figures:
    //   - "Contract Budget" is the BASE contract (item.base_contract_budget),
    //     not the variation-adjusted contract. Variations are surfaced
    //     in their own columns so totals are additive: Contract Budget
    //     + This HC Variation + Prev HC Variation = full claimable
    //     contract value at this claim's date.
    //   - "This HC Variation" and "Prev HC Variation" are split by the
    //     date of the most recent prior approved claim
    //     (variations on or before that date count as "prev",
    //     variations after that date and on or before this claim's
    //     date count as "this"). Computed server-side and surfaced
    //     per-item as item.this_hc_variations / item.prev_hc_variations.
    //   - "Total Claimed (HC)" = prev_hc_claimed + this_hc_claim
    //   - "Total Claimed (QS)" = prev_qs_claimed + this_qs_claim
    //   - "Still to Claim (HC)" = base + total variations - total HC
    //     claimed. Same formula for QS but vs total QS claimed.
    function renderFinalizedReport() {
        $('#hcClaimsTable').hide();
        $fixedFooter.hide();

        var $reportContainer = $('#finalizedReportContainer');
        if (!$reportContainer.length) {
            $reportContainer = $('<div id="finalizedReportContainer" class="finalized-report"></div>');
            $('#hcClaimsTable').after($reportContainer);
        }
        $reportContainer.empty().show();

        var categoryTotals = {};
        var grand = {
            contract_budget: 0,
            this_hc_var: 0, this_hc: 0, this_qs: 0,
            prev_hc_var: 0, prev_hc: 0, prev_qs: 0,
            total_hc: 0, total_qs: 0,
            still_hc: 0, still_qs: 0
        };

        budgetData.forEach(function(item) {
            var catName = item.category || 'Uncategorized';
            if (!categoryTotals[catName]) {
                categoryTotals[catName] = {
                    contract_budget: 0,
                    this_hc_var: 0, this_hc: 0, this_qs: 0,
                    prev_hc_var: 0, prev_hc: 0, prev_qs: 0,
                    total_hc: 0, total_qs: 0,
                    still_hc: 0, still_qs: 0
                };
            }
            var c = categoryTotals[catName];

            // base_contract_budget is the pre-variation figure;
            // contract_budget already has variations rolled in. We
            // want them split here.
            var base = parseFloat(item.base_contract_budget);
            if (isNaN(base)) {
                // Defensive fallback: treat base = contract - all
                // variations if API didn't surface base for some
                // reason. Keeps still_to_claim consistent.
                base = (parseFloat(item.contract_budget) || 0)
                     - (parseFloat(item.this_hc_variations) || 0)
                     - (parseFloat(item.prev_hc_variations) || 0);
            }
            var thisVar = parseFloat(item.this_hc_variations) || 0;
            var prevVar = parseFloat(item.prev_hc_variations) || 0;
            var thisHc  = parseFloat(item.this_hc_claim) || 0;
            var prevHc  = parseFloat(item.prev_hc_claimed) || 0;
            var thisQs  = parseFloat(item.this_qs_claim) || 0;
            var prevQs  = parseFloat(item.prev_qs_claimed) || 0;

            var totalHc = prevHc + thisHc;
            var totalQs = prevQs + thisQs;
            var totalContract = base + thisVar + prevVar;
            var stillHc = totalContract - totalHc;
            var stillQs = totalContract - totalQs;

            c.contract_budget += base;
            c.this_hc_var += thisVar;
            c.this_hc     += thisHc;
            c.this_qs     += thisQs;
            c.prev_hc_var += prevVar;
            c.prev_hc     += prevHc;
            c.prev_qs     += prevQs;
            c.total_hc    += totalHc;
            c.total_qs    += totalQs;
            c.still_hc    += stillHc;
            c.still_qs    += stillQs;

            grand.contract_budget += base;
            grand.this_hc_var += thisVar;
            grand.this_hc     += thisHc;
            grand.this_qs     += thisQs;
            grand.prev_hc_var += prevVar;
            grand.prev_hc     += prevHc;
            grand.prev_qs     += prevQs;
            grand.total_hc    += totalHc;
            grand.total_qs    += totalQs;
            grand.still_hc    += stillHc;
            grand.still_qs    += stillQs;
        });

        var html = '';
        html += '<div class="claim-report-section">';
        html += '<h3 class="report-title">Head Contract Claim Report</h3>';
        html += '<table class="report-table">';

        // Two-row header. Cell counts:
        //  row 1: Category, Contract Budget, This Claim, Prev Claims,
        //         Total Claimed, Still to Claim = 6 logical columns
        //         (some with colspan).
        //  row 2: 3 + 3 + 2 + 2 = 10 sub-headers under the colspan'd
        //         groups.
        // Total leaf columns = 1 + 1 + 3 + 3 + 2 + 2 = 12.
        // When the project type has qs=False the QS sub-headings
        // and matching cells drop out completely. Group colspans
        // shrink: This Claim / Prev Claims become 2 (variation + HC),
        // and Total Claimed / Still to Claim become 1 (HC only).
        var thisClaimSpan = hasQs ? 3 : 2;
        var prevClaimSpan = hasQs ? 3 : 2;
        var totalClaimedSpan = hasQs ? 2 : 1;
        var stillToClaimSpan = hasQs ? 2 : 1;

        html += '<thead>';
        html += '<tr>';
        html += '<th class="left" rowspan="2">Category</th>';
        html += '<th rowspan="2">Contract Budget</th>';
        html += '<th class="group-this" colspan="' + thisClaimSpan + '">This Claim</th>';
        html += '<th class="group-prev" colspan="' + prevClaimSpan + '">Prev Claims</th>';
        html += '<th colspan="' + totalClaimedSpan + '">Total Claimed</th>';
        html += '<th class="group-still" colspan="' + stillToClaimSpan + '">Still to Claim</th>';
        html += '</tr>';
        html += '<tr>';
        html += '<th class="group-this">HC Variation</th>';
        html += '<th class="group-this">HC Claim</th>';
        if (hasQs) html += '<th class="group-this">QS Claim</th>';
        html += '<th class="group-prev">HC Variation</th>';
        html += '<th class="group-prev">HC Claim</th>';
        if (hasQs) html += '<th class="group-prev">QS Claim</th>';
        html += '<th>HC</th>';
        if (hasQs) html += '<th>QS</th>';
        html += '<th class="group-still">HC</th>';
        if (hasQs) html += '<th class="group-still">QS</th>';
        html += '</tr>';
        html += '</thead>';

        html += '<tbody>';
        Object.keys(categoryTotals).forEach(function(catName) {
            var c = categoryTotals[catName];
            html += '<tr>';
            html += '<td class="left">' + catName + '</td>';
            html += '<td>' + formatMoney(c.contract_budget) + '</td>';
            html += '<td class="group-this">' + formatMoney(c.this_hc_var) + '</td>';
            html += '<td class="group-this">' + formatMoney(c.this_hc) + '</td>';
            if (hasQs) html += '<td class="group-this">' + formatMoney(c.this_qs) + '</td>';
            html += '<td class="group-prev">' + formatMoney(c.prev_hc_var) + '</td>';
            html += '<td class="group-prev">' + formatMoney(c.prev_hc) + '</td>';
            if (hasQs) html += '<td class="group-prev">' + formatMoney(c.prev_qs) + '</td>';
            html += '<td>' + formatMoney(c.total_hc) + '</td>';
            if (hasQs) html += '<td>' + formatMoney(c.total_qs) + '</td>';
            html += '<td class="group-still">' + formatMoney(c.still_hc) + '</td>';
            if (hasQs) html += '<td class="group-still">' + formatMoney(c.still_qs) + '</td>';
            html += '</tr>';
        });
        html += '</tbody>';

        html += '<tfoot><tr class="totals-row">';
        html += '<td class="left">Totals</td>';
        html += '<td>' + formatMoney(grand.contract_budget) + '</td>';
        html += '<td class="group-this">' + formatMoney(grand.this_hc_var) + '</td>';
        html += '<td class="group-this">' + formatMoney(grand.this_hc) + '</td>';
        if (hasQs) html += '<td class="group-this">' + formatMoney(grand.this_qs) + '</td>';
        html += '<td class="group-prev">' + formatMoney(grand.prev_hc_var) + '</td>';
        html += '<td class="group-prev">' + formatMoney(grand.prev_hc) + '</td>';
        if (hasQs) html += '<td class="group-prev">' + formatMoney(grand.prev_qs) + '</td>';
        html += '<td>' + formatMoney(grand.total_hc) + '</td>';
        if (hasQs) html += '<td>' + formatMoney(grand.total_qs) + '</td>';
        html += '<td class="group-still">' + formatMoney(grand.still_hc) + '</td>';
        if (hasQs) html += '<td class="group-still">' + formatMoney(grand.still_qs) + '</td>';
        html += '</tr></tfoot>';

        html += '</table></div>';

        $reportContainer.html(html);
    }
    
    // Render category row with collapse icon and subtotals.
    //
    // Audit note: the previous version emitted only one Invoiced
    // <td> (instead of Prev + This), used `item.invoiced` (the
    // total invoiced across all bills) as the value, and left
    // HC/QS Prev+This empty. That meant collapsed categories
    // showed an "Invoiced - Prev" total that wasn't the sum of
    // costing-level Invoiced - Prev cells, and pushed every cell
    // after Invoiced one column to the left. This rewrite:
    //   - emits exactly getColCount() cells in the same order as
    //     the data rows
    //   - sums Invoiced Prev and Invoiced This separately (matching
    //     the per-item invoiced_prev / invoiced_this values surfaced
    //     by the API)
    //   - sums HC Prev/This and QS Prev/This so that, when
    //     collapsed, the category row carries those totals through
    //     to the user-visible columns (per the latest UX pass).
    function renderCategoryRow(catName, catItems, colCount) {
        var $catRow = $('<tr class="category-row" data-category="' + catName + '">');

        $catRow.append(
            '<td><i class="fas fa-chevron-down collapse-icon"></i><strong>' +
            catName + '</strong></td>'
        );

        var catTotals = {
            contract_budget: 0,
            working_budget: 0,
            uncommitted: 0,
            committed: 0,
            fixed_on_site: 0,
            invoiced_prev: 0,
            invoiced_this: 0,
            prev_hc_claimed: 0,
            this_hc_claim: 0,
            prev_qs_claimed: 0,
            this_qs_claim: 0
        };

        catItems.forEach(function(item) {
            catTotals.contract_budget += parseFloat(item.contract_budget) || 0;
            catTotals.working_budget += parseFloat(item.working_budget) || 0;
            if (isConstruction) {
                catTotals.uncommitted +=
                    (parseFloat(item.uncommitted_qty) || 0) *
                    (parseFloat(item.uncommitted_rate) || 0);
            } else {
                catTotals.uncommitted += parseFloat(item.uncommitted) || 0;
            }
            catTotals.committed += parseFloat(item.committed) || 0;
            catTotals.fixed_on_site += parseFloat(item.fixed_on_site) || 0;
            catTotals.invoiced_prev += parseFloat(item.invoiced_prev) || 0;
            catTotals.invoiced_this += parseFloat(item.invoiced_this) || 0;
            catTotals.prev_hc_claimed += parseFloat(item.prev_hc_claimed) || 0;
            catTotals.this_hc_claim += parseFloat(item.this_hc_claim) || 0;
            catTotals.prev_qs_claimed += parseFloat(item.prev_qs_claimed) || 0;
            catTotals.this_qs_claim += parseFloat(item.this_qs_claim) || 0;
        });

        if (isConstruction) {
            $catRow.append('<td class="subtotal-cell"></td>'); // Unit
        }
        $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.contract_budget) + '</td>');
        $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.working_budget) + '</td>');

        if (isConstruction) {
            $catRow.append('<td class="subtotal-cell"></td>'); // Uncommit Qty
            $catRow.append('<td class="subtotal-cell"></td>'); // Uncommit Rate
            $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.uncommitted) + '</td>');
            $catRow.append('<td class="subtotal-cell"></td>'); // Notes
            $catRow.append('<td class="subtotal-cell"></td>'); // Commit Qty
            $catRow.append('<td class="subtotal-cell"></td>'); // Commit Rate
            $catRow.append('<td class="subtotal-cell committed-value">' + formatMoney(catTotals.committed) + '</td>');
        } else {
            $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.uncommitted) + '</td>');
            $catRow.append('<td class="subtotal-cell committed-value">' + formatMoney(catTotals.committed) + '</td>');
        }

        $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.fixed_on_site) + '</td>');
        $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.invoiced_prev) + '</td>');
        $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.invoiced_this) + '</td>');
        $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.prev_hc_claimed) + '</td>');
        $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.this_hc_claim) + '</td>');
        if (hasQs) {
            $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.prev_qs_claimed) + '</td>');
            $catRow.append('<td class="subtotal-cell">' + formatMoney(catTotals.this_qs_claim) + '</td>');
        }

        $catRow.on('click', function() {
            toggleCategory(catName);
        });

        return $catRow;
    }
    
    // Render budget table
    function renderBudgetTable() {
        // Hide report container and show budget table
        $('#finalizedReportContainer').hide();
        $('#hcClaimsTable').show();
        
        $tableBody.empty();
        var colCount = getColCount();
        
        if (!budgetData || budgetData.length === 0) {
            $tableBody.html('<tr><td colspan="' + colCount + '" class="text-center text-muted" style="padding: 40px;">No budget items found for this project.</td></tr>');
            $fixedFooter.hide();
            return;
        }
        
        // Group by category
        var categories = {};
        budgetData.forEach(function(item) {
            var cat = item.category || 'Uncategorized';
            if (!categories[cat]) {
                categories[cat] = [];
            }
            categories[cat].push(item);
        });
        
        // Totals
        var totals = {
            contract_budget: 0,
            working_budget: 0,
            uncommitted: 0,
            committed: 0,
            fixed_on_site: 0,
            invoiced_prev: 0,
            invoiced_this: 0,
            prev_hc_claimed: 0,
            this_hc_claim: 0,
            prev_qs_claimed: 0,
            this_qs_claim: 0
        };
        
        var isDraft = currentClaimData && currentClaimData.status === 0;
        
        // Render each category and its items
        Object.keys(categories).forEach(function(catName) {
            var catItems = categories[catName];
            
            // Category row with collapse icon and subtotals
            var $catRow = renderCategoryRow(catName, catItems, colCount);
            $tableBody.append($catRow);
            
            // Identify Internal (-10) and Labour (-5) categories via the
            // Categories.division sentinel rather than a string match on
            // the category name. The sentinel is the canonical
            // identifier (see core/models.py::Categories) and is now
            // enforced model-side. Every item under a given category
            // shares the same division, so reading it off the first
            // item is sufficient.
            var firstItem = catItems[0] || {};
            var catDivision = parseInt(firstItem.division, 10);
            if (isNaN(catDivision)) catDivision = 0;
            var isInternal = catDivision === -10;
            var isLabour = catDivision === -5;
            var isSpecialCategory = isInternal || isLabour;
            
            // Item rows
            catItems.forEach(function(item) {
                var $row = $('<tr class="item-row" data-costing-pk="' + item.costing_pk + '" data-category="' + catName + '">');
                
                // Item name with indent
                $row.append($('<td class="indent">').text(item.item));
                
                // Unit (construction only)
                if (isConstruction) {
                    $row.append($('<td>').text(item.unit || ''));
                }
                
                // Contract Budget
                $row.append($('<td>').text(formatMoney(item.contract_budget)));
                totals.contract_budget += parseFloat(item.contract_budget) || 0;
                
                // Working Budget
                $row.append($('<td>').text(formatMoney(item.working_budget)));
                totals.working_budget += parseFloat(item.working_budget) || 0;
                
                if (isConstruction) {
                    // Uncommitted Qty/Rate from DB
                    var uncommitQty = parseFloat(item.uncommitted_qty) || 0;
                    var uncommitRate = parseFloat(item.uncommitted_rate) || 0;
                    var uncommitAmt = uncommitQty * uncommitRate;
                    
                    // Show as blue click-to-edit links (like contract_budget)
                    var $qtyLink = $('<a href="#" class="click-to-edit qty-display" data-item-pk="' + item.costing_pk + '" data-value="' + uncommitQty + '">' + uncommitQty.toFixed(2) + '</a>');
                    $qtyLink.on('click', function(e) { e.preventDefault(); convertUncommittedToInput(item.costing_pk, 'qty'); });
                    $row.append($('<td>').append($qtyLink));
                    
                    var $rateLink = $('<a href="#" class="click-to-edit rate-display" data-item-pk="' + item.costing_pk + '" data-value="' + uncommitRate + '">' + formatMoney(uncommitRate) + '</a>');
                    $rateLink.on('click', function(e) { e.preventDefault(); convertUncommittedToInput(item.costing_pk, 'rate'); });
                    $row.append($('<td>').append($rateLink));
                    
                    $row.append($('<td class="uncommitted-amt" data-item-pk="' + item.costing_pk + '">').text(formatMoney(uncommitAmt)));
                    totals.uncommitted += uncommitAmt;
                    
                    // Notes icon
                    var hasNotes = item.uncommitted_notes && item.uncommitted_notes.trim() !== '';
                    $row.attr('data-notes', item.uncommitted_notes || '');
                    var $notesIcon = $('<i class="fas fa-sticky-note notes-icon' + (hasNotes ? ' has-notes' : '') + '" data-item-pk="' + item.costing_pk + '"></i>');
                    $notesIcon.attr('title', hasNotes ? item.uncommitted_notes : 'Add notes');
                    $notesIcon.on('click', function(e) {
                        e.stopPropagation();
                        toggleNotesRow(item.costing_pk, $row.attr('data-notes') || '');
                    });
                    $row.append($('<td style="text-align: center;">').append($notesIcon));
                    
                    // Committed Qty/Rate/Amount - green, clickable if has value
                    var commitQty = parseFloat(item.committed_qty) || 0;
                    var commitRate = parseFloat(item.committed_rate) || 0;
                    var commitAmt = parseFloat(item.committed) || 0;
                    var hasCommitted = commitAmt > 0;
                    var clickClass = hasCommitted ? 'committed-clickable' : 'committed-value';
                    
                    var $qtyTd = $('<td class="' + clickClass + '">').text(commitQty.toFixed(2));
                    var $rateTd = $('<td class="' + clickClass + '">').text(formatMoney(commitRate));
                    var $amtTd = $('<td class="' + clickClass + '">').text(formatMoney(commitAmt));
                    
                    if (hasCommitted) {
                        $qtyTd.on('click', function() { toggleCommittedDetailsRow(item.costing_pk); });
                        $rateTd.on('click', function() { toggleCommittedDetailsRow(item.costing_pk); });
                        $amtTd.on('click', function() { toggleCommittedDetailsRow(item.costing_pk); });
                    }
                    
                    $row.append($qtyTd).append($rateTd).append($amtTd);
                    totals.committed += commitAmt;
                } else {
                    // Uncommitted (editable if draft) - non-construction
                    var uncommitted = parseFloat(item.uncommitted) || 0;
                    if (isDraft) {
                        var $uncommittedCell = $('<td class="editable-cell">');
                        $uncommittedCell.append($('<input type="number" step="0.01" class="uncommitted-input">').val(uncommitted.toFixed(2)).on('change', function() { recalculateRow($row); }));
                        $row.append($uncommittedCell);
                    } else {
                        $row.append($('<td>').text(formatMoney(uncommitted)));
                    }
                    totals.uncommitted += uncommitted;
                    
                    // Committed - non-construction
                    var committed = parseFloat(item.committed) || 0;
                    $row.append($('<td>').text(formatMoney(committed)));
                    totals.committed += committed;
                }
                
                // Fixed on Site - blue click-to-edit (like contract_budget)
                var fixedOnSite = parseFloat(item.fixed_on_site) || 0;
                var $fosCell = $('<td class="fixed-on-site-cell" data-item-pk="' + item.costing_pk + '">');
                var $fosLink = $('<span class="click-to-edit">' + formatMoney(fixedOnSite) + '</span>');
                $fosLink.on('click', function(e) {
                    e.stopPropagation();
                    convertToInput(item.costing_pk, 'fixed_on_site', fixedOnSite, $row);
                });
                $fosCell.append($fosLink);
                $row.append($fosCell);
                totals.fixed_on_site += fixedOnSite;
                
                // Invoiced - Previous (from prior HC_claim_allocations.sc_invoiced)
                var invoicedPrev = parseFloat(item.invoiced_prev) || 0;
                $row.append($('<td class="invoiced-cell">').text(formatMoney(invoicedPrev)));
                totals.invoiced_prev = (totals.invoiced_prev || 0) + invoicedPrev;
                
                // Invoiced - This (bills/stocktakes associated with this claim)
                var invoicedThis = parseFloat(item.invoiced_this) || 0;
                $row.append($('<td class="invoiced-cell">').text(formatMoney(invoicedThis)));
                totals.invoiced_this = (totals.invoiced_this || 0) + invoicedThis;
                
                // HC Claim - Previous
                $row.append($('<td class="hc-claim-cell">').text(formatMoney(item.prev_hc_claimed)));
                totals.prev_hc_claimed += item.prev_hc_claimed;
                
                // HC Claim - This Claim
                if (isSpecialCategory) {
                    // Special categories (Internal/Labour): editable input, not formula
                    var $hcThisLink = $('<a href="#" class="click-to-edit hc-claim-display" data-item-pk="' + item.costing_pk + '" data-value="' + (item.this_hc_claim || 0) + '">' + formatMoney(item.this_hc_claim) + '</a>');
                    $hcThisLink.on('click', function(e) { e.preventDefault(); convertClaimToInput(item.costing_pk, 'hc', $row); });
                    $row.append($('<td class="hc-claim-cell this-hc-claim">').append($hcThisLink));
                } else {
                    // Normal categories: calculated formula cell
                    $row.append($('<td class="hc-claim-cell this-hc-claim">').text(formatMoney(item.this_hc_claim)));
                }
                totals.this_hc_claim += item.this_hc_claim;
                
                if (hasQs) {
                    // QS Claim - Previous
                    $row.append($('<td class="qs-claim-cell">').text(formatMoney(item.prev_qs_claimed)));
                    totals.prev_qs_claimed += item.prev_qs_claimed;

                    // QS Claim - This Claim
                    if (isSpecialCategory) {
                        // Special categories (Internal/Labour): editable input, not formula
                        var $qsThisLink = $('<a href="#" class="click-to-edit qs-claim-display" data-item-pk="' + item.costing_pk + '" data-value="' + (item.this_qs_claim || 0) + '">' + formatMoney(item.this_qs_claim) + '</a>');
                        $qsThisLink.on('click', function(e) { e.preventDefault(); convertClaimToInput(item.costing_pk, 'qs', $row); });
                        $row.append($('<td class="qs-claim-cell this-qs-claim">').append($qsThisLink));
                    } else {
                        // Normal categories: calculated formula cell
                        $row.append($('<td class="qs-claim-cell this-qs-claim">').text(formatMoney(item.this_qs_claim)));
                    }
                    totals.this_qs_claim += item.this_qs_claim;
                }
                
                // Store item data on row
                $row.data('item', item);
                
                $tableBody.append($row);
            });
        });
        
        // Update footer totals
        $('#totalContractBudget').text(formatMoney(totals.contract_budget));
        $('#totalWorkingBudget').text(formatMoney(totals.working_budget));
        $('#totalUncommitted').text(formatMoney(totals.uncommitted));
        $('#totalCommitted').text(formatMoney(totals.committed));
        $('#totalFixedOnSite').text(formatMoney(totals.fixed_on_site));
        $('#totalInvoicedPrev').text(formatMoney(totals.invoiced_prev));
        $('#totalInvoicedThis').text(formatMoney(totals.invoiced_this));
        $('#totalPrevHcClaimed').text(formatMoney(totals.prev_hc_claimed));
        $('#totalThisHcClaim').text(formatMoney(totals.this_hc_claim));
        if (hasQs) {
            $('#totalPrevQsClaimed').text(formatMoney(totals.prev_qs_claimed));
            $('#totalThisQsClaim').text(formatMoney(totals.this_qs_claim));
        }

        $fixedFooter.show();
    }
    
    // Recalculate a row's claim values when inputs change
    function recalculateRow($row) {
        var item = $row.data('item');
        if (!item) return;
        
        var uncommitted, fixedOnSite;
        var itemPk = item.costing_pk;
        
        if (isConstruction) {
            // Get qty and rate using helper functions (handles both input and display states)
            var uncommitQty = getUncommittedQty(itemPk);
            var uncommitRate = getUncommittedRate(itemPk);
            uncommitted = uncommitQty * uncommitRate;
            
            // Update the calculated amount cell
            $('.uncommitted-amt[data-item-pk="' + itemPk + '"]').text(formatMoney(uncommitted));
            
            item.uncommitted_qty = uncommitQty;
            item.uncommitted_rate = uncommitRate;
        } else {
            uncommitted = parseFloat($row.find('.uncommitted-input').val()) || 0;
        }
        
        // Use stored item data for fixed_on_site (already updated by saveFieldValue)
        fixedOnSite = parseFloat(item.fixed_on_site) || 0;
        
        // Update item data
        item.uncommitted = uncommitted;
        item.fixed_on_site = fixedOnSite;
        item.working_budget = uncommitted + (parseFloat(item.committed) || 0);

        // Pull every input the formulas need from the item dict and
        // default any missing field to 0. The backend surfaces these
        // explicitly: invoiced (total bill-allocations sum, used by the
        // QS formula); paid_invoices and invoices_in_claim (used by the
        // HC formula); prev_hc_claimed and prev_qs_claimed (approved
        // prior claims). Pre-fix the JS read item.invoiced which was
        // never sent (B5), giving NaN for non-construction projects.
        var contractBudget = parseFloat(item.contract_budget) || 0;
        var invoicedTotal = parseFloat(item.invoiced) || 0;
        var paidInvoices = parseFloat(item.paid_invoices) || 0;
        var invoicesInClaim = parseFloat(item.invoices_in_claim) || 0;
        var prevHc = parseFloat(item.prev_hc_claimed) || 0;
        var prevQs = parseFloat(item.prev_qs_claimed) || 0;

        // QS Claim = Max(0, Min(Contract Budget - C2C, Fixed on Site) - Previous QS Claims)
        // C2C_qs = Working Budget - Invoiced (total)
        var c2c_qs = item.working_budget - invoicedTotal;
        var qs_claim = Math.max(0, Math.min(contractBudget - c2c_qs, fixedOnSite) - prevQs);

        // HC Claim = Min(Remaining Claimable, Max(0, Contract Budget - C2C - Previous HC Claims))
        // Remaining Claimable = Contract Budget - Previous HC Claims
        // C2C_hc = Working Budget - (Paid Invoices + Invoices in This Claim)
        var remaining_claimable = contractBudget - prevHc;
        var c2c_hc = item.working_budget - paidInvoices - invoicesInClaim;
        var hc_claim = Math.min(remaining_claimable, Math.max(0, contractBudget - c2c_hc - prevHc));
        
        // Update display
        item.this_hc_claim = Math.round(hc_claim * 100) / 100;
        item.this_qs_claim = Math.round(qs_claim * 100) / 100;

        $row.find('.this-hc-claim').text(formatMoney(item.this_hc_claim));
        // .this-qs-claim cell is only emitted when hasQs is true;
        // the find() is a no-op otherwise, so this stays safe in
        // both modes.
        $row.find('.this-qs-claim').text(formatMoney(item.this_qs_claim));

        // Update totals
        recalculateTotals();
    }
    
    // Recalculate footer totals AND category subtotals from the
    // current per-row data. Footer is the single source of truth
    // for grand totals; category rows mirror their items so the
    // collapsed view stays accurate after edits.
    //
    // No '$' prefix here — formatMoney already returns a plain
    // number string and the initial render in renderBudgetTable
    // doesn't prefix either, so prefixing only on recalc was
    // visually inconsistent (numbers gained a "$" the first time
    // they were edited).
    function recalculateTotals() {
        var totals = {
            contract_budget: 0,
            working_budget: 0,
            uncommitted: 0,
            committed: 0,
            fixed_on_site: 0,
            invoiced_prev: 0,
            invoiced_this: 0,
            prev_hc_claimed: 0,
            this_hc_claim: 0,
            prev_qs_claimed: 0,
            this_qs_claim: 0
        };

        // Group running per-category subtotals at the same time so
        // we can refresh the category rows in a single pass.
        var byCategory = {};

        $('.item-row').each(function() {
            var item = $(this).data('item');
            if (!item) return;
            var cat = $(this).attr('data-category') || 'Uncategorized';
            if (!byCategory[cat]) {
                byCategory[cat] = {
                    contract_budget: 0, working_budget: 0,
                    uncommitted: 0, committed: 0, fixed_on_site: 0,
                    invoiced_prev: 0, invoiced_this: 0,
                    prev_hc_claimed: 0, this_hc_claim: 0,
                    prev_qs_claimed: 0, this_qs_claim: 0
                };
            }
            var c = byCategory[cat];

            var add = function(key, value) {
                var v = parseFloat(value) || 0;
                totals[key] += v;
                c[key] += v;
            };
            add('contract_budget', item.contract_budget);
            add('working_budget', item.working_budget);
            // Uncommitted is qty*rate in construction, an
            // explicit field otherwise.
            if (isConstruction) {
                var uc = (parseFloat(item.uncommitted_qty) || 0) *
                         (parseFloat(item.uncommitted_rate) || 0);
                totals.uncommitted += uc;
                c.uncommitted += uc;
            } else {
                add('uncommitted', item.uncommitted);
            }
            add('committed', item.committed);
            add('fixed_on_site', item.fixed_on_site);
            add('invoiced_prev', item.invoiced_prev);
            add('invoiced_this', item.invoiced_this);
            add('prev_hc_claimed', item.prev_hc_claimed);
            add('this_hc_claim', item.this_hc_claim);
            add('prev_qs_claimed', item.prev_qs_claimed);
            add('this_qs_claim', item.this_qs_claim);
        });

        $('#totalContractBudget').text(formatMoney(totals.contract_budget));
        $('#totalWorkingBudget').text(formatMoney(totals.working_budget));
        $('#totalUncommitted').text(formatMoney(totals.uncommitted));
        $('#totalCommitted').text(formatMoney(totals.committed));
        $('#totalFixedOnSite').text(formatMoney(totals.fixed_on_site));
        $('#totalInvoicedPrev').text(formatMoney(totals.invoiced_prev));
        $('#totalInvoicedThis').text(formatMoney(totals.invoiced_this));
        $('#totalPrevHcClaimed').text(formatMoney(totals.prev_hc_claimed));
        $('#totalThisHcClaim').text(formatMoney(totals.this_hc_claim));
        $('#totalPrevQsClaimed').text(formatMoney(totals.prev_qs_claimed));
        $('#totalThisQsClaim').text(formatMoney(totals.this_qs_claim));

        // Refresh category-row subtotals so the collapsed view
        // reflects the latest edits. We only need to update the
        // value-bearing cells (those with text content) — empty
        // placeholder cells (Unit, Qty, Rate, Notes) stay empty.
        $('tr.category-row').each(function() {
            var cat = $(this).attr('data-category');
            var c = byCategory[cat];
            if (!c) return;
            // Preserve the category-name <td> at index 0 and
            // refresh subtotal cells in the order they were
            // appended in renderCategoryRow.
            var $cells = $(this).children('td');
            // Cell layout (construction):
            //   0: name, 1: unit (empty), 2: contract, 3: working,
            //   4: uc qty (empty), 5: uc rate (empty), 6: uc amt,
            //   7: notes (empty), 8: cm qty (empty), 9: cm rate (empty),
            //   10: cm amt, 11: fixed, 12: inv prev, 13: inv this,
            //   14: hc prev, 15: hc this, 16: qs prev, 17: qs this
            // Non-construction:
            //   0: name, 1: contract, 2: working, 3: uncommitted,
            //   4: committed, 5: fixed, 6: inv prev, 7: inv this,
            //   8: hc prev, 9: hc this, 10: qs prev, 11: qs this
            if (isConstruction) {
                $cells.eq(2).text(formatMoney(c.contract_budget));
                $cells.eq(3).text(formatMoney(c.working_budget));
                $cells.eq(6).text(formatMoney(c.uncommitted));
                $cells.eq(10).text(formatMoney(c.committed));
                $cells.eq(11).text(formatMoney(c.fixed_on_site));
                $cells.eq(12).text(formatMoney(c.invoiced_prev));
                $cells.eq(13).text(formatMoney(c.invoiced_this));
                $cells.eq(14).text(formatMoney(c.prev_hc_claimed));
                $cells.eq(15).text(formatMoney(c.this_hc_claim));
                $cells.eq(16).text(formatMoney(c.prev_qs_claimed));
                $cells.eq(17).text(formatMoney(c.this_qs_claim));
            } else {
                $cells.eq(1).text(formatMoney(c.contract_budget));
                $cells.eq(2).text(formatMoney(c.working_budget));
                $cells.eq(3).text(formatMoney(c.uncommitted));
                $cells.eq(4).text(formatMoney(c.committed));
                $cells.eq(5).text(formatMoney(c.fixed_on_site));
                $cells.eq(6).text(formatMoney(c.invoiced_prev));
                $cells.eq(7).text(formatMoney(c.invoiced_this));
                $cells.eq(8).text(formatMoney(c.prev_hc_claimed));
                $cells.eq(9).text(formatMoney(c.this_hc_claim));
                $cells.eq(10).text(formatMoney(c.prev_qs_claimed));
                $cells.eq(11).text(formatMoney(c.this_qs_claim));
            }
        });
    }
    
    // Update claim status badge
    function updateClaimStatus() {
        if (!currentClaimData) {
            $claimStatus.hide();
            return;
        }
        
        var statusClass = '';
        switch(currentClaimData.status) {
            case 0: statusClass = 'draft'; break;
            case 1: statusClass = 'approved'; break;
            case 2: statusClass = 'sent'; break;
            case 3: statusClass = 'paid'; break;
        }
        
        $claimStatus
            .removeClass('draft approved sent paid')
            .addClass(statusClass)
            .text(currentClaimData.status_display)
            .show();
    }
    
    // Update action buttons visibility
    function updateActionButtons() {
        if (!currentClaimData) {
            $actionsRow.hide();
            $deleteBtn.hide();
            return;
        }
        
        // Only show actions for draft claims
        if (currentClaimData.status === 0) {
            $actionsRow.show();
            $deleteBtn.show();
        } else {
            $actionsRow.hide();
            $deleteBtn.hide();
        }
    }
    
    // Finalize claim - creates HC_claim_allocations entries
    function finalizeClaim() {
        if (!currentClaimPk) {
            alert('No claim selected.');
            return;
        }
        
        // Gather allocation data from table for all items
        var allocations = [];
        $('.item-row').each(function() {
            var item = $(this).data('item');
            if (item) {
                allocations.push({
                    costing_pk: item.costing_pk,
                    category_pk: item.category_pk,
                    contract_budget: item.contract_budget || 0,
                    working_budget: item.working_budget || 0,
                    uncommitted: item.uncommitted || 0,
                    committed: item.committed || 0,
                    fixed_on_site: item.fixed_on_site || 0,
                    fixed_on_site_previous: 0, // To be calculated on backend if needed
                    fixed_on_site_this: item.fixed_on_site || 0,
                    sc_invoiced_previous: item.invoiced_prev || 0,
                    sc_invoiced: item.invoiced_this || 0,
                    hc_claimed_previous: item.prev_hc_claimed || 0,
                    hc_claimed: item.this_hc_claim || 0,
                    qs_claimed_previous: item.prev_qs_claimed || 0,
                    qs_claimed: item.this_qs_claim || 0
                });
            }
        });
        
        $.ajax({
            url: '/core/finalize_hc_claim/',
            type: 'POST',
            contentType: 'application/json',
            headers: { 'X-CSRFToken': (typeof Utils !== 'undefined' ? Utils.getCSRFToken() : $('input[name="csrfmiddlewaretoken"]').val()) },
            data: JSON.stringify({
                hc_claim_pk: currentClaimPk,
                allocations: allocations
            }),
            success: function(response) {
                if (response.status === 'success') {
                    alert('Claim finalized successfully!');
                    
                    // Reload to reflect changes
                    loadClaimsList();
                    loadClaimData(currentClaimPk);
                } else {
                    alert('Error: ' + (response.error || 'Failed to finalize claim'));
                }
            },
            error: function(xhr) {
                var error = xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error';
                alert('Error finalizing claim: ' + error);
            }
        });
    }
    
    // Delete claim
    function deleteClaim() {
        if (!currentClaimPk) return;
        
        if (!confirm('Are you sure you want to delete this draft claim? This cannot be undone.')) {
            return;
        }
        
        $.ajax({
            url: '/core/delete_hc_claim/',
            type: 'POST',
            contentType: 'application/json',
            headers: { 'X-CSRFToken': Utils.getCSRFToken() },
            data: JSON.stringify({
                hc_claim_pk: currentClaimPk
            }),
            success: function(response) {
                if (response.status === 'success') {
                    alert('Claim deleted.');
                    currentClaimPk = null;
                    currentClaimData = null;
                    
                    $claimSelector.val('');
                    clearTable();
                    loadClaimsList();
                    loadAvailableBills();
                } else {
                    alert('Error: ' + (response.error || 'Failed to delete claim'));
                }
            },
            error: function(xhr) {
                var error = xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error';
                alert('Error deleting claim: ' + error);
            }
        });
    }
    
    // Clear table
    function clearTable() {
        currentClaimPk = null;
        currentClaimData = null;
        budgetData = [];

        var colCount = getColCount();
        $tableBody.html('<tr><td colspan="' + colCount + '" style="text-align: center; padding: 40px; color: #6c757d;"><i class="fas fa-file-invoice-dollar" style="font-size: 48px; margin-bottom: 15px; display: block;"></i>Select a claim or create a new one to view budget data.</td></tr>');
        // The fixed footer lives outside the scrollable table area; the
        // pre-fix code referenced an undeclared $tableFooter, which threw
        // a ReferenceError every time we cleared the table (B4 in the
        // review).
        $fixedFooter.hide();
        $('#finalizedReportContainer').hide();
        $actionsRow.hide();
        $deleteBtn.hide();
        $claimStatus.hide();
    }
    
    // Format date as dd-mmm-yy
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        var d = new Date(dateStr);
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var day = String(d.getDate()).padStart(2, '0');
        var month = months[d.getMonth()];
        var year = String(d.getFullYear()).slice(-2);
        return day + '-' + month + '-' + year;
    }
    
    // Format money
    function formatMoney(value) {
        if (typeof Utils !== 'undefined' && Utils.formatMoney) {
            return Utils.formatMoney(value);
        }
        return (value || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
    
    // Initialize when DOM is ready
    $(document).ready(function() {
        init();
    });
    
})();
</script>
