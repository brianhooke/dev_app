version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      # Persist SQLite database across deployments
      - /var/app/db:/app/db
    env_file:
      - .env
    environment:
      # EB passes these directly - they override .env if present
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-dev_app.settings.production_aws}
      - RDS_HOSTNAME=${RDS_HOSTNAME:-}
      - RDS_PORT=${RDS_PORT:-5432}
      - RDS_DB_NAME=${RDS_DB_NAME:-}
      - RDS_USERNAME=${RDS_USERNAME:-}
      - RDS_PASSWORD=${RDS_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-}
      - XERO_CLIENT_ID=${XERO_CLIENT_ID:-}
      - XERO_CLIENT_SECRET=${XERO_CLIENT_SECRET:-}
      # No defaults for superuser creds. Set them in your local .env if you
      # want the auto-bootstrap to run; otherwise start.sh skips it.
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:-}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - ENABLE_DIAGNOSTICS=${ENABLE_DIAGNOSTICS:-}
